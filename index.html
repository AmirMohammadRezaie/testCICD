<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <link rel="stylesheet" href="style.css">
  <!-- CI/CD smoke test: 2026-11-18 -->
</head>
<body>
  <main class="card">
    <h1>Hello World!</h1>
    <p class="welcome">Welcome to this simple test site. It's built with plain HTML, CSS, and JavaScript, with no frameworks or dependencies.</p>
    <button id="clickBtn" type="button">Click Me</button>
    <p id="message" class="message" aria-live="polite"></p>

    <section id="about" class="about" aria-labelledby="about-heading">
      <h2 id="about-heading">About This Project</h2>
      <p>This demo website is used to practice automated testing and continuous deployment.</p>
    </section>

    <section id="chat" class="chat" aria-labelledby="chat-heading">
      <h2 id="chat-heading">Chat with AI</h2>
      <div id="chatLog" class="chat-log" role="log" aria-live="polite">
        <p class="chat-msg chat-msg-assistant">Hi! Ask me anything.</p>
      </div>
      <form id="chatForm" class="chat-form">
        <label for="chatInput" class="visually-hidden">Your message</label>
        <input id="chatInput" type="text" maxlength="2000" placeholder="Type a message…" autocomplete="off" required>
        <button id="chatSend" type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
  <script src="chat.js"></script>
</body>
</html>
